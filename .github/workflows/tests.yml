name: Tests

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maven-tests:
    name: Maven tests (Java 17)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: pom.xml
      - name: Install the OpenCL loader for runtime discovery
        # No GPU driver is installed; hardware tests skip when no device is available.
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ocl-icd-libopencl1
      - name: Run the full Maven test suite
        run: sh ./mvnw --batch-mode --no-transfer-progress test
